name: Compiler l'APK Gestion TELEMA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dependances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Retirer la permission internet (application 100% hors ligne)
        run: sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser le projet
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Mettre l'APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-TELEMA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
